# Priceless World Modpack - Docker Compose with MCDReforged
# Usage: docker-compose up -d

version: '3.8'

services:
  minecraft-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEOFORGE_VERSION: 21.1.233
        MC_VERSION: 1.21.1
        MCDR_VERSION: 2.15.7
        MEMORY_MIN: 4G
        MEMORY_MAX: 8G
    container_name: priceless-world-server
    restart: unless-stopped
    ports:
      - "25565:25565"
      - "25575:25575"
    volumes:
      # Persist world data
      - ./server-data/world:/server/world
      # Persist server logs
      - ./server-data/logs:/server/logs
      # Persist MCDR data
      - ./server-data/mcdr/logs:/server/mcdr/logs
      - ./server-data/mcdr/plugins:/server/mcdr/plugins
      # Optional: Mount custom server.properties
      # - ./server-data/server.properties:/server/server.properties
      # Optional: Mount custom mods
      # - ./server-data/mods:/server/mods
      # Optional: Mount custom MCDR config
      # - ./server-data/mcdr/config.yml:/server/mcdr/config.yml
    environment:
      # JVM Memory Settings
      - JAVA_FLAGS=-Xms4G -Xmx8G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1
      # Server Settings (override server.properties)
      - EULA=true
    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

