name: Build Modrinth Pack
on:
  push:
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.github/**'
      - 'kubejs/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Install packwiz
        run: |
          curl -o packwiz https://github.com/packwiz/packwiz/releases/latest/download/packwiz-linux-amd64
          chmod +x packwiz
      - name: Download mods via packwiz
        run: |
          ./packwiz refresh
      - name: Create Modrinth package
        run: |
          mkdir -p modrinth-pack/overrides
          # Copy pack.toml as modrinith.index.json will be generated
          cp pack.toml modrinth-pack/
          # Copy overrides except kubejs
          rsync -av --exclude='kubejs/' overrides/ modrinth-pack/overrides/
          # Copy downloaded mods
          if [ -d "mods" ]; then
            cp -r mods modrinth-pack/overrides/
          fi
          # Create the mrpack file (zip with .mrpack extension)
          cd modrinth-pack
          zip -r ../modpack.mrpack .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: modrinth-modpack
          path: modpack.mrpack
          retention-days: 30
